    const urlBase64ToUint8Array = (base64String) => {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); }
      return outputArray;
    };

      const [defaultBreastDuration, setDefaultBreastDuration] = useState(() => parseInt(localStorage.getItem('bobo_def_breast_dur') || '10'));
      const [showVitaminDButton, setShowVitaminDButton] = useState(() => localStorage.getItem('bobo_show_vit_d') !== 'false');

      const [babyName, setBabyName] = useState(() => localStorage.getItem('bobo_name') || 'בובו');

      const [feedType, setFeedType] = useState('breastfeeding');

      const [timerTime, setTimerTime] = useState(0);

      const [diaperType, setDiaperType] = useState('wet');

      const [growthType, setGrowthType] = useState('weight');
      const [growthValue, setGrowthValue] = useState('');
      const [growthNotes, setGrowthNotes] = useState('');

      const [editingGrowthId, setEditingGrowthId] = useState(null);

      const [editingItem, setEditingItem] = useState(null);

      const [editSelect1, setEditSelect1] = useState(''); 
      const [editSelect2, setEditSelect2] = useState(''); 
      const [editTimestamp, setEditTimestamp] = useState(''); 
      const [editSaveStatus, setEditSaveStatus] = useState('idle');

      const [vitDSuccess, setVitDSuccess] = useState(false);
      const [expandedPumpingDate, setExpandedPumpingDate] = useState(null);

      const [lastFeedTime, setLastFeedTime] = useState(null);
      const [timeToNextFeed, setTimeToNextFeed] = useState(null);
      const hasNotifiedLeadRef = useRef(false);
      
      const [timelineFilter, setTimelineFilter] = useState('all');
      const [selectedTimelineDate, setSelectedTimelineDate] = useState('');
      const [showReportModal, setShowReportModal] = useState(false);

      const quickSolids = ['בטטה', 'גזר', 'קישוא', 'דלעת', 'בננה', 'אבוקדו', 'טחינה', 'תפוח'];

      const isToday = (timestamp) => {
        if (!timestamp) return false;
        const date = new Date(timestamp); const today = new Date();
        return date.getDate() === today.getDate() && date.getMonth() === today.getMonth() && date.getFullYear() === today.getFullYear();
      };

      const actualBabyFeedings = timeline.filter(f => f.logType === 'feeding' && !f.notes?.includes('ויטמין D') && !f.notes?.includes('[שאיבת_חלב]') && f.type !== 'pumping');
      const actualFeedingsToday = actualBabyFeedings.filter(f => isToday(f.timestamp));
      const todaysDiapers = timeline.filter(d => d.logType === 'diaper' && isToday(d.timestamp));
      
      const isFeedGoalReached = actualFeedingsToday.length >= targetFeeds && targetFeeds > 0;
      const isDiaperGoalReached = todaysDiapers.length >= targetDiapers && targetDiapers > 0;

      const getLocalDateStr = (offsetDays = 0) => {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);

      };

      useEffect(() => {
        const handleBeforeInstallPrompt = (e) => {

        };

        if (!isStandalone && !hasDismissedPrompt) {

        }

        return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
      }, []);

      const triggerAndroidInstall = async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          setShowInstallPrompt(false);

      useEffect(() => { 
        setAmount(defaultMl); setBottleType(defaultBottleType); setDuration(defaultBreastDuration); 
      }, [defaultMl, defaultBottleType, defaultBreastDuration]);

      const stopNoiseSound = () => {
        if (noiseSourceNodeRef.current) {
          try { noiseSourceNodeRef.current.stop(); } catch(e) {}
          noiseSourceNodeRef.current.disconnect();
          noiseSourceNodeRef.current = null;
        }
        if (audioCtxRef.current && audioCtxRef.current.state !== 'closed') {
          try { audioCtxRef.current.close(); } catch(e) {}
          audioCtxRef.current = null;
        }
        if (noiseIntervalRef.current) {
          clearInterval(noiseIntervalRef.current);
          noiseIntervalRef.current = null;
        }
        setIsNoisePlaying(false);
        setNoiseTimerRemain(null);
      };

      const startNoiseSound = async (type = noiseType) => {
        stopNoiseSound();
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioContext();
          audioCtxRef.current = ctx;

          if (ctx.state === 'suspended') {
            await ctx.resume();
          }

          const bufferSize = 2 * ctx.sampleRate;
          const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);

          if (type === 'white') {
            for (let i = 0; i < bufferSize; i++) {
              output[i] = Math.random() * 2 - 1;
            }
          } else if (type === 'pink') {
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            for (let i = 0; i < bufferSize; i++) {
              const white = Math.random() * 2 - 1;
              b0 = 0.99886 * b0 + white * 0.0555179;
              b1 = 0.99332 * b1 + white * 0.0750759;
              b2 = 0.96900 * b2 + white * 0.1538520;
              b3 = 0.86650 * b3 + white * 0.3104856;
              b4 = 0.55000 * b4 + white * 0.5329522;
              b5 = -0.7616 * b5 - white * 0.0168980;
              output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
              b6 = white * 0.115926;
            }
          } else if (type === 'shh') {
            for (let i = 0; i < bufferSize; i++) {
              const env = Math.sin((i / bufferSize) * Math.PI * 4);
              output[i] = (Math.random() * 2 - 1) * Math.max(0, env) * 0.8;
            }
          } else if (type === 'heart') {
            for (let i = 0; i < bufferSize; i++) {
              const t = (i / ctx.sampleRate) % 1.0;
              const beat = (t < 0.1 || (t > 0.25 && t < 0.35)) ? Math.sin(t * Math.PI * 20) * 0.9 : 0;
              output[i] = beat + (Math.random() * 0.04 - 0.02);
            }
          }

          const whiteNoise = ctx.createBufferSource();
          whiteNoise.buffer = noiseBuffer;
          whiteNoise.loop = true;

          const gainNode = ctx.createGain();
          gainNode.gain.setValueAtTime(0.3, ctx.currentTime);

          if (type === 'pink' || type === 'heart') {
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(type === 'heart' ? 180 : 800, ctx.currentTime);
            whiteNoise.connect(filter);
            filter.connect(gainNode);
          } else {
            whiteNoise.connect(gainNode);
          }

          gainNode.connect(ctx.destination);
          whiteNoise.start(0);

          noiseSourceNodeRef.current = whiteNoise;
          noiseGainNodeRef.current = gainNode;
          setIsNoisePlaying(true);

          if (noiseTimerMin > 0) {
            let remain = noiseTimerMin * 60;
            setNoiseTimerRemain(remain);
            noiseIntervalRef.current = setInterval(() => {
              remain -= 1;
              setNoiseTimerRemain(remain);
              if (remain <= 0) {
                stopNoiseSound();
              }
            }, 1000);
          }
        } catch(e) {
          console.error("Audio error", e);
        }
      };

      const handleToggleNoise = () => {

        if (bottleMl > 0 || breastMins > 0) {
          msg += ` (${bottleMl > 0 ? `${bottleMl} מ"ל` : ''}${bottleMl > 0 && breastMins > 0 ? ' + ' : ''}${breastMins > 0 ? `${breastMins} דק' הנקה` : ''})`;
        }
        msg += `\n🚼 *חיתולים:* ${todaysDiapers.length} (${wetDiapers} פיפי, ${dirtyDiapers} קקי)\n`;
        if (pumpingMl > 0) msg += `🥛 *שאיבות היום:* ${pumpingMl} מ"ל\n`;
        if (todaySolids) msg += `🥑 *טעימות היום:* ${todaySolids}\n`;
        if (stickyNote) msg += `📝 *פתקית:* ${stickyNote}\n`;
        msg += `\n_נשלח מאפליקציית בובו_ 👶❤️`;

        const url = `https://wa.me/?text=${encodeURIComponent(msg)}`;
        window.open(url, '_blank');
      };

      const getOfflineQueue = () => { try { return JSON.parse(localStorage.getItem('bobo_offline_queue') || '[]'); } catch(e) { return []; } };
      const setOfflineQueue = (q) => { localStorage.setItem('bobo_offline_queue', JSON.stringify(q)); setPendingSyncCount(q.length); };

      const syncOfflineData = async () => {
        const queue = getOfflineQueue();
        if (queue.length === 0) {
          setPendingSyncCount(0);
          return;
        }
        
        const remaining = [];
        let anySuccess = false;
        
        for (const item of queue) {
          try {
            const { error } = await supabaseClient.from(item.table).insert(item.payload);
            if (error) {
              remaining.push(item);
            } else {
              anySuccess = true;
            }
          } catch (e) { 
            remaining.push(item); 
          }
        }
        
        setOfflineQueue(remaining);
        if (anySuccess) {

        const seconds = Math.floor((new Date() - new Date(timestamp)) / 1000);
        if (seconds < 60) return 'ממש עכשיו';
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `לפני ${minutes} דק'`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `לפני ${hours} שעות`;
        const days = Math.floor(hours / 24);
        if (days === 1) return 'אתמול';
        if (days === 2) return 'שלשום';

          .on('postgres_changes', { event: '*', schema: 'public', table: 'diapers' }, debouncedReload)

      useEffect(() => {

      // --- מנוע פענוח הפקודה הקולית בעברית ---
      const parseAndExecuteVoiceCommand = async (text) => {
        const clean = text.toLowerCase().trim();
        
        // חילוץ מספר (כמות מ"ל או משך דקות)
        const numMatch = clean.match(/\d+/);
        const detectedNum = numMatch ? parseInt(numMatch[0]) : null;

        // זיהוי צד
        let detectedSide = 'both';
        if (clean.includes('שמאל')) detectedSide = 'left';
        else if (clean.includes('ימין')) detectedSide = 'right';

        // 1. ויטמין D
        if (clean.includes('ויטמין') || clean.includes('ויטמינים') || clean.includes('טיפות')) {
          await logVitaminD();
          return `💊 נרשם ויטמין D בהצלחה`;
        }

        // 2. חיתול
        if (clean.includes('חיתול') || clean.includes('פיפי') || clean.includes('קקי') || clean.includes('יציאה')) {
          let type = 'wet';
          if ((clean.includes('פיפי') && clean.includes('קקי')) || clean.includes('שניהם') || clean.includes('גם וגם')) type = 'both';
          else if (clean.includes('קקי') || clean.includes('צואה')) type = 'dirty';

          await performInsert('diapers', { type, notes: 'נרשם קולית', created_at: new Date().toISOString() });
          return `🚼 נרשם חיתול: ${type === 'wet' ? 'פיפי' : type === 'dirty' ? 'קקי' : 'פיפי וקקי'}`;
        }

        // 3. שאיבה
        if (clean.includes('שאיבה') || clean.includes('שאבתי')) {
          const ml = detectedNum || 60;
          await performInsert('feedings', {
            type: 'bottle',
            side: detectedSide,
            amount_ml: ml,
            notes: '[שאיבת_חלב] נרשם קולית',
            created_at: new Date().toISOString()
          });
          return `🥛 נרשמה שאיבה: ${ml} מ"ל (צד ${detectedSide === 'left' ? 'שמאל' : detectedSide === 'right' ? 'ימין' : 'שניהם'})`;
        }

        // 4. הנקה
        if (clean.includes('הנקה') || clean.includes('הנקתי') || clean.includes('יונק')) {
          const mins = detectedNum || defaultBreastDuration;
          await performInsert('feedings', {
            type: 'breastfeeding',
            side: detectedSide,
            duration_minutes: mins,
            notes: 'נרשם קולית',
            created_at: new Date().toISOString()
          });
          return `🤱 נרשמה הנקה: ${mins} דקות (צד ${detectedSide === 'left' ? 'שמאל' : detectedSide === 'right' ? 'ימין' : 'שניהם'})`;
        }

        // 5. בקבוק / האכלה
        if (clean.includes('בקבוק') || clean.includes('האכלה') || clean.includes('מטרנה') || clean.includes('סימילאק') || clean.includes('תמל') || clean.includes('תמ"ל') || clean.includes('שאוב') || clean.includes('חלב')) {
          const ml = detectedNum || defaultMl;
          const isExpressed = clean.includes('שאוב');
          await performInsert('feedings', {
            type: 'bottle',
            side: detectedSide,
            amount_ml: ml,
            notes: `[${isExpressed ? 'שאוב' : 'תמ"ל'}] נרשם קולית`,
            created_at: new Date().toISOString()
          });
          return `🍼 נרשם בקבוק: ${ml} מ"ל ${isExpressed ? 'שאוב' : 'תמ"ל'}`;
        }

        // 6. טעימות מוצקים
        if (clean.includes('טעימה') || clean.includes('טעימות') || clean.includes('אכל') || clean.includes('אוכל')) {
          let reaction = 'liked';
          if (clean.includes('לא אהב') || clean.includes('נגעל') || clean.includes('ירק')) reaction = 'disliked';
          else if (clean.includes('נייטרלי') || clean.includes('ככה ככה') || clean.includes('בסדר')) reaction = 'neutral';
          else if (clean.includes('אלרגיה') || clean.includes('פריחה') || clean.includes('חשש')) reaction = 'allergic';

          let foodName = quickSolids.find(f => clean.includes(f));
          if (!foodName) {
            foodName = clean.replace(/טעימה|טעימות|אכל|אוכל|אהב|לא|נייטרלי|אלרגיה/g, '').trim();
          }

          await performInsert('solids', {
            food_name: foodName || 'טעימה כללית',
            reaction,
            notes: 'נרשם קולית',
            created_at: new Date().toISOString()
          });
          return `🥑 נרשמה טעימה: ${foodName || 'כללית'}`;
        }

        throw new Error(`לא זוהתה פקודה מדויקת ("${text}")`);

      const startVoiceRecognition = () => {
        triggerVibration(20);

        if (!SpeechRecognition) {
          alert('זיהוי קולי אינו נתמך בדפדפן זה. באייפון יש להשתמש ב-Safari (iOS 14.5+) ובאנדרואיד ב-Chrome.');
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'he-IL';
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;
        recognition.continuous = false; // מבטיח סיום עצמאי ברגע שיש שקט

        latestTranscriptRef.current = '';
        setVoiceTranscript('');
        setVoiceFeedback(null);
        setIsListening(true);

        recognition.onresult = (event) => {
          let interim = '';
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            interim += event.results[i][0].transcript;
          }
          if (interim) {
            latestTranscriptRef.current = interim;
            setVoiceTranscript(interim);
          }
        };

        recognition.onspeechend = () => {
          recognition.stop();
        };

        recognition.onend = async () => {
          setIsListening(false);
          const finalTxt = latestTranscriptRef.current.trim();

          setIsListening(false);

            setVoiceFeedback({ status: 'error', text: 'שגיאת זיהוי: ' + event.error });
            setTimeout(() => setVoiceFeedback(null), 3000);
          }
        };

          recognition.start();

          setIsListening(false);
        }

        timeline.forEach(item => {
          const type = item.logType === 'vitamin_d' ? 'ויטמין D' : item.logType === 'pumping' ? 'שאיבה' : item.logType === 'feeding' ? (item.type === 'breastfeeding' ? 'הנקה' : 'בקבוק') : item.logType === 'diaper' ? 'חיתול' : item.logType === 'solid' ? 'טעימות מוצקים' : 'גדילה';

          const notesStr = item.notes ? item.notes.trim() : '';
          csvContent += `${type},${subType},${value},${side},${new Date(item.timestamp).toLocaleDateString('he-IL')},${new Date(item.timestamp).toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'})},${notesStr ? notesStr.replace(/,/g, " ") : ""}\n`;
        });
        const link = document.createElement("a"); link.setAttribute("href", URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }))); link.setAttribute("download", `יומן_בובו_${babyName}.csv`); document.body.appendChild(link); link.click(); document.body.removeChild(link);

        if (days <= 0) return `${prefix} היום`; if (days < 7) return `${prefix} ${days} ימים`;
        if (days < 28) return `${prefix} ${Math.floor(days / 7)} שבועות`;
        return `${prefix} ${Math.floor(days / 30.4)} חודשים`;

          if (!grouped[dateKey]) { grouped[dateKey] = { dateKey, dateStr: date.toLocaleDateString('he-IL'), totalAmount: 0, count: 0, timestamp: new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime(), logs: [] }; }
          grouped[dateKey].totalAmount += (log.amount_ml || 0); grouped[dateKey].count += 1; grouped[dateKey].logs.push(log);
        });
        const result = Object.values(grouped).sort((a, b) => b.timestamp - a.timestamp);
        result.forEach(day => { day.logs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)); });
        return result;

          const dateStr = `${daysNames[d.getDay()]} ${d.getDate()}`;
          const dayLogs = timeline.filter(log => { const logDate = new Date(log.timestamp); return logDate.getDate() === d.getDate() && logDate.getMonth() === d.getMonth() && logDate.getFullYear() === d.getFullYear(); });
          const bottleMl = dayLogs.filter(l => l.logType === 'feeding' && l.type === 'bottle').reduce((sum, l) => sum + (l.amount_ml || 0), 0);
          const pumpingMl = dayLogs.filter(l => l.logType === 'pumping').reduce((sum, l) => sum + (l.amount_ml || 0), 0);
          const breastMins = dayLogs.filter(l => l.logType === 'feeding' && l.type === 'breastfeeding').reduce((sum, l) => sum + (l.duration_minutes || 0), 0);
          stats.push({ dateStr, bottleMl, pumpingMl, breastMins });

        return stats;

        if (isOverdue) return `הגיע הזמן! (-${formattedTime})`;
        return formattedTime;

                        <div className="text-4xl mb-3 drop-shadow-sm">💧</div>
                        <div className="text-4xl font-black text-blue-600 mb-1">{weeklyData.wet}</div>
                        <div className="text-sm text-blue-800 font-bold">חיתולים רטובים</div>
                      </div>
                      <div className="border-2 border-amber-100 bg-amber-50/50 p-6 rounded-[2rem] text-center print-bg">
                        <div className="text-4xl mb-3 drop-shadow-sm">💩</div>
                        <div className="text-4xl font-black text-amber-700 mb-1">{weeklyData.dirty}</div>
                        <div className="text-sm text-amber-900 font-bold">חיתולים צואים</div>
                      </div>
                    </div>
                    <p className="text-xs text-gray-400 text-center mt-5 font-medium">* הסיכום מתייחס ל-7 הימים האחרונים בלבד ומשקף את תקינות מערכת העיכול והרוויה.</p>
                  </div>
                </div>

                <div className="w-full max-w-2xl mx-auto mt-6 mb-8">
                  <button 
                    onClick={() => {triggerVibration(15); window.print()}} 
                    className="w-full bg-gradient-to-r from-teal-500 to-emerald-500 text-white font-black text-lg py-5 rounded-2xl shadow-xl shadow-teal-500/30 transition-transform active:scale-95 flex items-center justify-center gap-3 border border-teal-400/50"
                  >
                    <span className="text-2xl">🖨️</span> הדפס או שמור כ-PDF עכשיו
                  </button>
                </div>
              </div>
            );
          })}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
