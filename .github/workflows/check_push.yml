name: Check Feedings and Push

on:
  schedule:
    - cron: '*/15 * * * *'  # רץ אוטומטית כל 15 דקות
  workflow_dispatch:      # מאפשר גם הפעלה ידנית מתי שתרצה

jobs:
  run-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pywebpush

      - name: Run push checker script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python check_push.py
